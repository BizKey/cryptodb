# ─────────────────────────────────────────────────────────────────────────────
# Тюнинг PostgreSQL под маломощный хост:
#     1 ядро CPU · 1 ГБ RAM · 10 ГБ диск
#   (контейнер ограничен docker-compose: mem_limit 512m, cpus 1.0)
#
# Файл монтируется в контейнер как config_file (read-only) — см. docker-compose.yml.
# Указаны только изменённые параметры; всё остальное — встроенные умолчания.
# ─────────────────────────────────────────────────────────────────────────────

# ── Память ────────────────────────────────────────────────────────────────
shared_buffers = 128MB              # ~четверть памяти контейнера (512 МБ)
effective_cache_size = 384MB        # подсказка планировщику; память НЕ резервирует
work_mem = 4MB                      # на одну операцию сортировки/join
maintenance_work_mem = 32MB         # на VACUUM / CREATE INDEX
huge_pages = off

# ── Соединения ────────────────────────────────────────────────────────────
max_connections = 50                # каждое соединение ≈ 1–2 МБ памяти

# ── WAL и чекпоинты: реже fsync → меньше нагрузки на CPU и диск ──────────
max_wal_size = 256MB
min_wal_size = 64MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ── Автовакуум: на одном ядре меньше фоновых процессов ───────────────────
autovacuum_max_workers = 2

# ── Безопасность ──────────────────────────────────────────────────────────
# fsync и full_page_writes остаются включёнными (по умолчанию):
# надёжность важнее скорости на слабой машине.
